<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Customer Requirements</title>
    <link rel="stylesheet" href="../css/requirement.css"/>
    <link rel="icon" href="../assets/logo.png">
</head>
<body>

<header>
    <nav class="nav-bar">
        <ul class="navi">
            <li>
                <a href="../php/secretary.php">
                    <img class="logo" src="../assets/logo.png" alt="Rean Ramz Lending Corp">
                </a>
            </li>
            <li>
                <a href="secretary.php">
                    <img class="home" src="../assets/home.svg" alt="Home">
                </a>
            </li>
        </ul>
    </nav>
</header>

<div class="customer-container">
    <div class="customer-action">
        <button class="customer-btn" id="listBtn">Customers</button>
        <button class="add-btn" id="addBtn">Add New</button>
        <input type="text" class="search-bar" placeholder="Search" id="searchBar">
    </div>

    <!-- Message area -->
    <div id="formMessage" style="padding: 10px; border-radius: 5px; margin-top: 10px; text-align: center; font-weight: bold; display: none;"></div>

    <div class="content-section" id="customerListSection">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Business</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>Status</th>
                        <th>Operations</th>
                    </tr>
                </thead>
                <tbody id="customerTableBody">
                    <!-- rows populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <div class="content-section" id="addCustomerSection" style="display:none;">
        <h2>Add New Customer</h2>
        <form class="add-customer" id="addCustomerForm">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" placeholder="Input First Name" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" placeholder="Input Last Name" required>
            </div>
            <div class="form-group">
                <label>Business Name</label>
                <input type="text" name="business_name" placeholder="Input Business Name" required>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone_number" placeholder="Input Phone Number" required>
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" name="address" placeholder="Input Address" required>
            </div>
            <div class="form-submit">
                <button type="submit" class="btn add-btn">Submit Customer</button>
            </div>
        </form>
    </div>
</div>

<script src="../js/requirement.js"></script>
</body>
</html>
