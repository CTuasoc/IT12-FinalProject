<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="../css/secretary.css">
</head>
<body>

  <!-- Top bar with icons -->
  <div class="topbar">
    <div class="right">
      <img src="../assets/home.svg" height="70px" width="70px">
      <img src="../assets/user.svg" height="70px" width="70px">
      <div class="logout">
        <a href="../php/logout.php">Logout</a>
      </div>
    </div>
  </div>

  <!-- Daily Statistics box -->
  <div class="stats-box">
    <div>
      <h2>DAILY STATISTICS</h2>
      <button>View more</button>
    </div>
    <div class="stats-graphics">
      <img src="../assets/piechart.svg" alt="Pie chart">
      <img src="../assets/barchart.svg" alt="Bar chart">
    </div>
  </div>

  <div class="serno">
    <!-- Services -->
    <div class="services">
      <h3>Services</h3>
      <div class="service-items">
        <div class="service-card">
          <img src="../assets/payments.svg" alt="Payment">
          <h4>PAYMENT TRANSACTIONS</h4>
        </div>
        <div class="service-card">
          <img src="../assets/record.svg" alt="Customer records">
          <h4>CUSTOMER RECORDS</h4>
        </div>
        <div class="service-card">
          <img src="../assets/dailyrec.svg" alt="Daily records">
          <h4>DAILY RECORDS</h4>
        </div>
      </div>
    </div>

    <!-- Notifications -->
    <div class="notify">
      <h3>Notifications</h3>
      <div class="notify-box">No new notifications</div>
      <div class="notify-box">System running smoothly</div>
    </div>
  </div>

</body>
</html>
