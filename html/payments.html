<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment History</title>
    <link rel="stylesheet" href="../css/payments.css">
    <link rel="stylesheet" href="../css/loading.css">
    <link rel="icon" href="../assets/logo-dark.png">
</head>
<body>
<div id="loadingScreen" class="loading-screen">
  <div class="loading-content">
    <div class="loading-logo">
      <img src="../assets/logo-light.png" alt="Rean Ramz Lending Corp" class="loading-logo-img">
    </div>
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading...</div>
  </div>
</div>
<header>
  <nav class="nav-bar">
    <ul class="navi">
      <li>
        <a href="../php/{{HOME_PAGE}}">
          <img class="logo" src="../assets/logo-light.png" alt="Rean Ramz Lending Corp">
        </a>
      </li>
      <li>
        <a href="../php/{{HOME_PAGE}}">
          <img class="home" src="../assets/home.svg" alt="Home">
        </a>
      </li>
    </ul>
  </nav>
</header>

    <!-- Main Content Container -->
    <div class="serno">
        <div class="page-header">
            <div class="header-content">
                <div>
                    <h2>PAYMENT MANAGEMENT</h2>
                    
                </div>
            </div>
        </div>

        <!-- Payment History Container -->
        <div class="payment-container">
            <div class="section-header">
                <h3>Payment History</h3>
                <button id="refreshBtn" class="refresh-btn" title="Refresh payment history">
                    <span>🔄 Refresh</span>
                </button>
            </div>
            <div id="loadingMessage" class="loading-message">Loading payment history...</div>
            <div id="noPaymentsMessage" class="no-payments-message" style="display: none;">
                No payment records found.
            </div>
            <div id="paymentTableContainer" class="payment-table-wrapper" style="display: none;">
                <table id="paymentTable" class="payment-table">
                    <thead>
                        <tr>
                            <th>Customer Name</th>
                            <th>Date of Loan</th>
                            <th>Principal</th>
                            <th>Interest</th>
                            <th>Terms</th>
                            <th>Daily Payment</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="paymentTableBody">
                        <!-- Payment records will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/payments.js"></script>
    <script src="../js/loading.js"></script>
</body>
</html>
