<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Management| Rean Ramz Lending Corp</title>
    <link rel="stylesheet" href="../css/payments.css">
    <link rel="stylesheet" href="../css/loading.css">
    <link rel="icon" href="../assets/logo-dark.png">
</head>
<body>
<div id="loadingScreen" class="loading-screen">
  <div class="loading-content">
    <div class="loading-logo">
      <img src="../assets/logo-light.png" alt="Rean Ramz Lending Corp" class="loading-logo-img">
    </div>
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading...</div>
  </div>
</div>
<header>
  <nav class="nav-bar">
            <div class="nav-left">
                <a href="../php/collector.php">
                    <img class="logo" src="../assets/logo-light.png" alt="Rean Ramz Lending Corp">
                </a>
            </div>
            <div class="nav-right">
                <div id="themeToggle" class="theme-toggle"></div>
                <a href="../php/collector.php" class="home-btn">
                    <span>HOME</span>
                </a>
            </div>
        </nav>
</header>

    <!-- Main Content Container -->
    <div class="serno">
        <div class="page-header">
            <div class="header-content">
                <div>
                    <h2>DAILY PAYMENT MANAGEMENT</h2>
                    <p id="todayDate">Today: Loading...</p>
                </div>
                <button id="refreshBtn" class="refresh-btn">
                    <span>🔄 Refresh</span>
                </button>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search customers by name..." autocomplete="off">
            </div>
        </div>

        <!-- Customers Table Container -->
        <div class="customers-container">
            <div id="loadingMessage" class="loading-message">Loading customers...</div>
            <div id="noCustomersMessage" class="no-customers-message" style="display: none;">
                No customers found.
            </div>
            <div id="customersTableContainer" class="customers-table-wrapper" style="display: none;">
                <table id="customersTable" class="customers-table">
                    <thead>
                        <tr>
                            <th>Customer Name</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="customersTableBody">
                        <!-- Customer rows will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Record Daily Payment</h3>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="paymentForm">
                    <div class="form-group">
                        <label>Customer Name</label>
                        <div class="display-field" id="modalCustomerName"></div>
                    </div>
                    
                    <div class="form-group">
                        <label>Payment Date</label>
                        <div class="display-field" id="modalPaymentDate"></div>
                    </div>
                    
                    <div class="form-group">
                        <label>Total Loan Amount</label>
                        <div class="display-field" id="modalLoanAmount">₱0.00</div>
                    </div>
                    
                    <div class="form-group">
                        <label>Amount Paid</label>
                        <div class="display-field" id="modalAmountPaid">₱0.00</div>
                    </div>
                    
                    <div class="form-group">
                        <label>Remaining Balance</label>
                        <div class="display-field" id="modalRemainingBalance">₱0.00</div>
                    </div>
                    
                    <div class="form-group">
                        <label>Daily Payment Amount</label>
                        <div class="display-field" id="modalDailyPayment">₱0.00</div>
                    </div>
                    
                    <div class="form-group">
                        <label>Loan Terms</label>
                        <div class="display-field" id="modalTerms">0 days</div>
                    </div>
                    
                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="customAmountCheckbox">
                            <label for="customAmountCheckbox">Pay different amount today</label>
                        </div>
                    </div>
                    
                    <div class="form-group" id="customAmountGroup" style="display: none;">
                        <label>Enter Amount to Pay Today</label>
                        <input type="number" id="customAmount" min="1" step="0.01" placeholder="Enter amount">
                    </div>
                    
                    <div class="form-group">
                        <div class="info-box" id="paymentInfo">
                            Click Proceed to record the daily payment.
                        </div>
                    </div>
                    
                    <div class="form-group" id="alreadyPaidMessage" style="display: none;">
                        <div class="already-paid-box">
                            This customer has already paid today.
                        </div>
                    </div>
                    
                    <div class="form-actions" id="paymentActions">
                        <button type="button" class="btn-cancel" id="cancelPayment">Cancel</button>
                        <button type="submit" class="btn-proceed" id="proceedPayment">Proceed with Payment</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/payments.js"></script>
    <script src="../js/dark_light_mode.js"></script>
    <script src="../js/loading.js"></script>
</body>
</html>
