<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rean Ramz Lending Corp</title>
  <link rel="stylesheet" href="../css/create_acc.css"/>
  <link rel="icon" href="../assets/logo.png">
</head>
<body>
  <header>
    <nav class="nav-bar">
      <ul class="navi">
        <li>
          <a href="admin.html">
            <img class="logo" src="../assets/logo.png" alt="Rean Ramz Lending Corp">
          </a>
        </li>
        <li>
          <a href="admin.html">
            <img class="home" src="../assets/home.svg" alt="Home">
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <div class="create-main">
    <h2>CREATE ACCOUNT</h2>

    <div class="roles">
      <label>Role</label>
      <select required>
        <option value="" disabled selected hidden>Select Role</option>
        <option value="secretary">Secretary</option>
        <option value="collector">Collector</option>
        <option value="customer">Customer</option>
      </select>
    </div>
    
    
    <div class="account-info">
      <div class="field">
        <label>Name</label>
        <input type="text" placeholder="Input Name">
      </div>
      <div class="field">
        <label>Phone Number</label>
        <input type="text" placeholder="Input Phone Num">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="text" placeholder="Input Email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" placeholder="Input Password">
      </div>
    </div>
    <div class="btn-container">
      <p class="create-acc">Create</p>
    </div>
  </div>
  

</body>
</html>
