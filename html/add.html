<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Record | Rean Ramz Lending Corp</title>
  <link rel="stylesheet" href="../css/add.css">
  <link rel="stylesheet" href="../css/loading.css">
  <link rel="icon" type="image/png" href="../assets/logo-dark.png">
</head>

<body>
<div id="loadingScreen" class="loading-screen">
  <div class="loading-content">
    <div class="loading-logo">
      <img src="../assets/logo-light.png" alt="Rean Ramz Lending Corp" class="loading-logo-img">
    </div>
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading...</div>
  </div>
</div>

<header>
  <nav class="nav-bar">
    <div class="nav-left">
      <a href="../php/collector.php">
        <img class="logo" src="../assets/logo-light.png" alt="Rean Ramz Lending Corp">
      </a>
    </div>
    <div class="nav-right">
      <div id="themeToggle" class="theme-toggle"></div>
      <a href="../php/collector.php" class="home-btn">
        <span>HOME</span>
      </a>
    </div>
  </nav>
</header>

<main>
  <!-- Message area -->
  <div id="message" style="text-align:center; margin-bottom:1rem;"></div>

  <form id="addForm">
    <section class="customer-info">
      <div class="data">
        <h1>Customer Information</h1>
      </div>
      <div class="input-info">
        <div class="detail-box">
          <p>First Name</p>
          <input type="text" name="firstname" placeholder="Input First Name" required>
        </div>
        <div class="detail-box">
          <p>Last Name</p>
          <input type="text" name="lastname" placeholder="Input Last Name" required>
        </div>
        <div class="detail-box">
          <p>Business Name</p>
          <input type="text" id="businessname" name="businessname" placeholder="Input Business Name" required>
        </div>
        <div class="detail-box">
          <p>Phone Number</p>
          <input type="tel" name="phonenum" placeholder="09XX-XXX-XXXX" 
                pattern="09[0-9]{2}-[0-9]{3}-[0-9]{4}" 
                title="Format: 09XX-XXX-XXXX (11 digits)" required>
        </div>
        <div class="detail-box">
          <p>Address</p>
          <input type="text" name="address" placeholder="Input Address" required>
        </div>  
      </div>
    </section>

    <section class="loan-info">
      <div class="data">
        <h1>Loan Information</h1>
      </div>
      <div class="input-info">
        <div class="loan-box">
          <p>Loan Amount</p>
          <input type="number" id="loanamount" name="loanamount" placeholder="Input Amount" required>
        </div>
        <div class="loan-box">
          <p>Due Date</p>
          <input type="date" id="duedate" name="duedate" required>
        </div>
        <div class="loan-box">
          <p>Interest Rate</p>
          <input type="text" id="interestrate" name="interestrate" value="5%" readonly>
        </div>
        <div class="loan-box">
          <p>Total Amount</p>
          <input type="text" id="totalamount" name="totalamount" readonly>
        </div>
        <div class="loan-box">
          <p>Per Day</p>
          <input type="text" id="perday" name="perday" readonly>
        </div>
      </div>
    </section>
    
    <div class="btn">
      <button type="submit" class="add-btn">Add to Record</button>
      <p id="formMessage" style="margin-top:10px;"></p>
    </div>
  </form>
</main>

<script src="../js/add.js"></script>
<script src="../js/dark_light_mode.js"></script>
<script src="../js/loading.js"></script>
<div id="notificationContainer"></div>
</body>
</html>
