<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Record | Rean Ramz Lending Corp</title>
  <link rel="stylesheet" href="../css/add.css">
  <link rel="icon" type="image/png" href="../assets/logo-dark.png">
</head>

<body>
<header>
  <nav class="nav-bar">
            <div class="nav-left">
                <a href="admin.html">
                    <img class="logo" src="../assets/logo-light.png" alt="Rean Ramz Lending Corp">
                </a>
            </div>
            <div class="nav-right">
                <div id="themeToggle" class="theme-toggle"></div>
                <a href="../php/admin.php" class="home-btn">
                    <span>HOME</span>
                </a>
            </div>
        </nav>
</header>

<main class="container">
  <!-- Message area -->
  <div id="message" style="text-align:center; margin-bottom:1rem;"></div>

  <form id="addForm">
    <section class="customer-info">
      <div class="data">
        <h1>Customer Information</h1>
      </div>
      <div class="input-info">
        <div class="detail-box">
          <p>First Name</p>
          <input type="text" name="firstname" placeholder="Input First Name" required>
        </div>
        <div class="detail-box">
          <p>Last Name</p>
          <input type="text" name="lastname" placeholder="Input Last Name" required>
        </div>
        <div class="detail-box">
          <p>Business Name</p>
          <input type="text" id="businessname" name="businessname" placeholder="Input Business Name" required>
        </div>
        <div class="detail-box">
          <p>Phone Number</p>
          <input type="text" name="phonenum" placeholder="Input Phone Num" required>
        </div>
        <div class="detail-box">
          <p>Address</p>
          <input type="text" name="address" placeholder="Input Address" required>
        </div>  
      </div>
    </section>

    <section class="loan-info">
      <div class="data">
        <h1>Loan Information</h1>
      </div>
      <div class="input-info">
        <div class="loan-box">
          <p>Loan Amount</p>
          <input type="number" id="loanamount" name="loanamount" placeholder="Input Amount" required>
        </div>
        <div class="loan-box">
          <p>Due Date</p>
          <input type="date" id="duedate" name="duedate" required>
        </div>
        <div class="loan-box">
          <p>Interest Rate</p>
          <p class="bold">5%</p>
        </div>
        <div class="loan-box">
          <p>Total Amount</p>
          <input type="text" id="totalamount" name="totalamount" readonly>
        </div>
        <div class="loan-box">
          <p>Per Day</p>
          <input type="text" id="perday" name="perday" readonly>
        </div>
      </div>
    </section>
    <div class="btn">
      <button type="submit" class="add-btn">Add to Record</button>
      <p id="formMessage" style="margin-top:10px;"></p>
    </div>
  </form>
</main>
<script src="../js/add.js"></script>
<script src="../js/dark_light_mode.js"></script>
</body>
</html>
