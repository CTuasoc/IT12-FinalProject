<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rean Ramz Lening Corp</title>
        <link rel="stylesheet" href="../css/add.css">
        <link rel="icon" type="image/png" href="../assets/logo.png">
    </head>

    <body>
        <header>
            <nav class="nav-bar">
              <ul class="navi">
                <li>
                  <a href="admin.html">
                    <img class="logo" src="../assets/logo.png" alt="Rean Ramz Lending Corp">
                  </a>
                </li>
                <li>
                  <a href="admin.html">
                    <img class="home" src="../assets/home.svg" alt="Home">
                  </a>
                </li>
              </ul>
            </nav>
        </header>

        <main class="container">
            <section class="customer-info">
              <div class="data">
                <h1>Customer Information</h1>
              </div>
              <div class="input-info">
                <div class="detail-box">
                  <p>Name</p>
                  <input type="text" placeholder="Input Name">
                </div>
                <div class="detail-box">
                  <p>Business Name</p>
                  <input type="text" placeholder="Input Business Name">
                </div>
                <div class="detail-box">
                  <p>Phone Number</p>
                  <input type="text" placeholder="Input Phone Num">
                </div>
                <div class="detail-box">
                  <p>Address</p>
                  <input type="text" placeholder="Input Address">
                </div>  
              </div>
            </section>

            <section class="loan-info">
              <div class="data">
                <h1>Loan Information</h1>
              </div>
              <div class="input-info">
                <div class="loan-box">
                  <p>Amount</p>
                  <input type="text" placeholder="Input Amount">
                </div>
                <div class="loan-box">
                  <p>Due Date</p>
                  <input type="date">
                </div>
                <div class="loan-box">
                  <p>Interest Rate</p>
                  <p class="bold">5%</p>
                </div>
                <div class="loan-box">
                  <p>Total Amount</p>
                  <p class="bold">10000</p>
                </div>
                <div class="loan-box">
                  <p>Per Day</p>
                  <p class="bold">500</p>
                </div>
              </div>
            </section>

            <a class="add-btn">Add to Record</a>
        </main>
    </body> 
</html>
