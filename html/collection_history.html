<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection History</title>
    <link rel="stylesheet" href="../css/collection_history.css">
    <link rel="stylesheet" href="../css/loading.css">
    <link rel="stylesheet" href="../css/filters.css">
    <link rel="icon" href="../assets/logo-dark.png">
</head>
<body>
<header>
  <nav class="nav-bar">
    <div class="nav-left">
      <a href="../php/{{HOME_PAGE}}">
        <img class="logo" src="../assets/logo-light.png" alt="Rean Ramz Lending Corp">
      </a>
    </div>
    <div class="nav-right">
      <div id="themeToggle" class="theme-toggle"></div>
      <a class="home-btn" href="../php/{{HOME_PAGE}}">
        <span>HOME</span>
      </a>
    </div>
  </nav>
</header>

    <!-- Main Content Container -->
    <div class="serno">
        <div class="page-header">
            <div class="header-top">
                <div class="title-search-wrapper">
                    <div>
                        <h2>COLLECTION HISTORY</h2>
                    </div>
                    <div class="search-container">
                        <div class="search-box">
                            <input class="search" type="text" id="search" placeholder="Search customers...">
                            <button class="filter-toggle" id="filterToggle">Filters ▼</button>
                        </div>
                        <div class="date-filter">
                            <label for="paymentDateFilter">Collection date:</label>
                            <input type="date" id="paymentDateFilter">
                        </div>
                        <div class="filters-panel" id="filtersPanel">
                            <div class="filter-group">
                                <h3>Filter by Status</h3>
                                <div class="filter-options">
                                    <label class="filter-option">
                                        <input type="radio" name="status" value="all" checked>
                                        <span>All Customers</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="radio" name="status" value="paid">
                                        <span>Fully Paid</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="radio" name="status" value="unpaid">
                                        <span>Unpaid/Partial</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="radio" name="status" value="overdue">
                                        <span>Overdue</span>
                                    </label>
                                </div>
                            </div>

                            <div class="filter-group">
                                <h3>Filter by Name</h3>
                                <div class="filter-options">
                                    <label class="filter-option">
                                        <input type="radio" name="nameType" value="both" checked>
                                        <span>Both Names</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="radio" name="nameType" value="first">
                                        <span>First Name Only</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="radio" name="nameType" value="last">
                                        <span>Last Name Only</span>
                                    </label>
                                </div>
                            </div>

                            <div class="filter-group">
                                <h3>Sort by</h3>
                                <div class="filter-options">
                                    <label class="filter-option">
                                        <input type="radio" name="sort" value="name_asc" checked>
                                        <span>Name (A-Z)</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="radio" name="sort" value="name_desc">
                                        <span>Name (Z-A)</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="radio" name="sort" value="balance_high">
                                        <span>Highest Balance</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="radio" name="sort" value="balance_low">
                                        <span>Lowest Balance</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="radio" name="sort" value="newest">
                                        <span>Newest First</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="radio" name="sort" value="oldest">
                                        <span>Oldest First</span>
                                    </label>
                                </div>
                            </div>

                            <div class="filter-actions">
                                <button class="filter-btn" id="applyFilters">Apply Filters</button>
                                <button class="filter-btn secondary" id="clearFilters">Clear All</button>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Refresh Button -->
                <div class="refresh-button-wrapper">
                    <button id="refreshBtn" class="refresh-btn-minimalist" title="Refresh collection history">
                        🔄 Refresh
                    </button>
                </div>
            </div>
        </div>

        <!-- Collection History Container -->
        <div class="collection-container">
            <div id="loadingMessage" class="loading-message">Loading collection history...</div>
            <div id="noCollectionsMessage" class="no-collections-message" style="display: none;">
                No collection records found.
            </div>
            <div id="collectionTableContainer" class="collection-table-wrapper" style="display: none;">
                <table id="collectionTable" class="collection-table">
                <thead>
                    <tr>
                        <th>Customer Name</th>
                        <th>Date of loan</th>
                        <th>Principal</th>
                        <th>Interest</th>
                        <th>Paid Today</th>
                        <th>Payment Status</th>
                    </tr>
                </thead>
                    <tbody id="collectionTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/collection_history.js"></script>
    <script src="../js/loading.js"></script>
    <script src="../js/dark_light_mode.js"></script>
</body>
</html>
