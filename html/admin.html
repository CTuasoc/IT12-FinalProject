<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rean Ramz Lending Corp</title>
  <link rel="stylesheet" href="../css/admin.css"/>
  <link rel="icon" href="../assets/logo.png">
</head>
<body>
  <header>
    <nav class="nav-bar">
      <ul class="navi">
        <li>
          <a href="admin.html">
            <img class="logo" src="../assets/logo.png" alt="Rean Ramz Lending Corp">
          </a>
        </li>
        <li>
          <a href="admin.html">
            <img class="home" src="../assets/home.svg" alt="Home">
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <div class="stats-box">
    <div>
      <h2>DAILY STATISTICS</h2>
      <a>View more</a>
    </div>
    <div class="stats-graphics">
      <img src="../assets/piechart.svg" alt="Pie chart">
      <img src="../assets/barchart.svg" alt="Bar chart">
    </div>
  </div>

  <div class="serno">
    <div class="services">
      <h3>Services</h3>

        <a href="add.html">
          <div class="service-items">
            <div class="service-card">
              <img src="../assets/addcustomer.svg" alt="Add customer">
              <h4>ADD CUSTOMER RECORD</h4>
            </div>
        </a>
        <a href="create_acc.html">
          <div class="service-card">
            <img src="../assets/addcustomer.svg" alt="Add customer">
            <h4>CREATE ACCOUNT</h4>
          </div>
        </a>

        <a href="loginstatus_dashboard.html">
          <div class="service-card">
            <img src="../assets/login.svg" alt="Log-In">
            <h4>LOG-IN STATUS</h4>
          </div>
        </a>
        
        <a href="check_rec.html">
          <div class="service-card">
            <img src="../assets/record.svg" alt="Customer records">
            <h4>CHECK RECORDS</h4>
          </div>
        </a>
      </div>
    </div>

    <div class="notify">
      <h3>Notifications</h3>
      <div class="notify-box">No new notifications</div>
      <div class="notify-box">System running smoothly</div>
    </div>
  </div>

</body>
</html>
